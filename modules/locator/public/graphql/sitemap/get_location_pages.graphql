query get_location_pages(
    $page: Int = 1, 
    $per_page: Int = 100
) {
    items: records(
        page: $page
        per_page: $per_page
        filter: {
            table:{ value: "modules/insites_locator/location" }
            deleted_at:{ exists: false }
            properties: [
                { name: "status", value: "enabled" }
            ]
        }
    ) {
        total_entries
        total_pages
        per_page
        current_page
        results {
            updated_at
            slug: property(name: "slug")
        }
    }
}