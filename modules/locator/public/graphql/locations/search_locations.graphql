query search_locations(
    $page: Int = 1, 
    $size: Int = 20,
    $id: ID,
    $date_from: String,
    $date_to: String,
    $uuid: String,
    $distance: Float = 10.0,
    $point: GeometryJSON,
    $system_field_uuid: String
) {
    items: records(
        page: $page
        per_page: $size
        sort: { properties: { name: "location_name", order: ASC } }
        filter: {
            table:{ value: "modules/insites_locator/location" }
            deleted_at:{ exists: false }
            id: { value: $id }
            properties: [
                {
                    name: "geojson",
                    distance_sphere: {
                        center: $point,
                        distance_in_km: $distance
                    }
                },
                { name: "status", value: "enabled" },
                { name: "uuid", value: $uuid },
                { name: "start_date", range: { gte: $date_from }},
                { name: "end_date", range: { lte: $date_to }}
            ]
        }
    ) {
        total_entries
        total_pages
        per_page
        current_page
        results {
            id
            created_at
            updated_at
            properties
            category: related_record(
                table: "modules/insites_locator/category",
                foreign_property: "uuid",
                join_on_property: "category_uuid"
            ){
                name: property(name: "category_name")
                slug: property(name: "slug")
            }
            location_image: property_upload(name: "location_image") {
                url
                file_name
                extension
            }
            pin_icon: property_upload(name: "pin_icon") {
                url
                file_name
                extension
            }
            image_1: property_upload(name: "image_1") {
                url
                file_name
                extension
            }
            image_2: property_upload(name: "image_2") {
                url
                file_name
                extension
            }
            image_3: property_upload(name: "image_3") {
                url
                file_name
                extension
            }
            image_4: property_upload(name: "image_4") {
                url
                file_name
                extension
            }
            image_5: property_upload(name: "image_5") {
                url
                file_name
                extension
            }
            system_fields: related_records(
                table: "modules/insites_locator/location_system_field"
                foreign_property: "uuid"
                join_on_property: "system_field_uuids"
                filter: {
                    properties: [
                        { name: "system_field", value: $system_field_uuid }
                    ]
                }
            ) {
                id
                properties
            }
        }
    }
}